<svg xmlns="http://www.w3.org/2000/svg" width="182" height="54" viewBox="0 0 182 54" role="img" aria-labelledby="title desc">
  <title id="title">Get it on Google Play badge</title>
  <desc id="desc">Rounded badge with Google Play triangle and text that reads Get it on Google Play.</desc>
  <rect width="182" height="54" rx="10" fill="#000"/>
  <g transform="translate(16 9)">
    <g>
      <polygon points="0,0 0,36 21,18" fill="#00d8ff"/>
      <polygon points="0,0 21,18 11,23" fill="#3ddc84"/>
      <polygon points="0,36 21,18 11,13" fill="#f4b41b"/>
      <polygon points="11,13 21,18 11,23" fill="#ff4f5a"/>
    </g>
    <text x="34" y="12" fill="#fff" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="500" letter-spacing="2">GET IT ON</text>
    <text x="34" y="30" fill="#fff" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">Google Play</text>
  </g>
</svg>
