name: Monthly Export to Google Drive

on:
  schedule:
    # Run on the 1st of every month at 2:00 AM UTC
    - cron: '0 2 1 * *'
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode - dry run (no upload)'
        required: false
        default: 'false'
        type: boolean

jobs:
  export:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run monthly export
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          if [[ "${{ github.event.inputs.test_mode }}" == "true" ]]; then
            echo "Running in test mode - displaying configuration only"
            echo "SUPABASE_URL: ${SUPABASE_URL}"
            echo "GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID}"
            # Just validate the script runs without errors
            node -e "
              import('./scripts/export/supabase-export.mjs').then(m => {
                console.log('Supabase export module loaded successfully');
              }).catch(e => console.error('Error:', e));
            "
          else
            npm run export:monthly
          fi
        
      - name: Archive export logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-logs
          path: |
            export*.log
            npm-debug.log*
          retention-days: 30

